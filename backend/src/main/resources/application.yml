spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockshield}
    username: ${DB_USERNAME:stockshield}
    password: ${DB_PASSWORD:stockshield}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  port: 8080
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
